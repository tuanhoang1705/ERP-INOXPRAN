server {
  listen 8080;
  server_name _;
  server_tokens off;
  # Khai báo UTF-8 cho HTML / CSS / JS: thiếu charset, trình duyệt có thể đọc CSS bằng Windows-1252 (dấu › hiện thành "â€º").
  charset utf-8;
  charset_types text/html text/css text/plain application/javascript text/javascript application/json image/svg+xml;

  # nginx chỉ kế thừa add_header từ server khi location không tự khai báo add_header nào;
  # location nào có add_header riêng phải lặp lại các header chung bên dưới.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Hệ thống nội bộ: không cho công cụ tìm kiếm lập chỉ mục (kèm robots.txt và thẻ meta robots).
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_read_timeout 65s;
  }

  location /_app/immutable/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  # Ứng dụng một trang (SvelteKit adapter-static): file tĩnh có thật thì trả file, còn lại (kể cả "/") trả 200.html.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /200.html;
  }
}
