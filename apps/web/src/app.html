<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102f46" />
    <meta name="description" content="Hệ thống vận hành nội bộ INOXPRAN" />
    <!-- Hệ thống nội bộ: không cho công cụ tìm kiếm lập chỉ mục (kèm robots.txt và header X-Robots-Tag của nginx). -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
